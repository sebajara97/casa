/* =========================== Base =========================== */
:root { --gap: 16px; --pad: 24px; --cardPad: 22px; --garland: 0px; }
@media (max-width: 1099px) { :root { --gap: 12px; --pad: 16px; --cardPad: 16px; } }
[data-theme="navidad"] body.anim { --garland: 10px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); background-attachment: fixed; color: var(--text); font-family: var(--font);
  -webkit-font-smoothing: antialiased; overflow: hidden; transition: background .4s; user-select: none; -webkit-user-select: none;
}
input { user-select: text; -webkit-user-select: text; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg { display: block; flex-shrink: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.sb { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app {
  position: relative; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: var(--gap);
  padding: calc(var(--pad) + var(--garland)) var(--pad) var(--pad);
}

/* Header */
.top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
.head-l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.headline { font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date { font-family: var(--display); font-weight: var(--headW); font-size: clamp(20px, 2.2vw, 28px); letter-spacing: -.02em; white-space: nowrap; }
.head-r { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.pill { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 16px; border-radius: 26px; background: var(--card); border: var(--cardBorder); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.ibtn { width: 52px; height: 52px; border-radius: 26px; border: var(--cardBorder); background: var(--card); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); display: flex; align-items: center; justify-content: center; padding: 0; }
.talk { height: 52px; padding: 0 22px 0 16px; border-radius: 26px; border: 0; background: var(--accent); color: #FFF; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; flex-shrink: 0; }

/* Grid */
.grid {
  position: relative; z-index: 1; flex: 1 1 auto; min-height: 0; display: grid; gap: var(--gap);
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-areas: "clock agenda tasks" "timers agenda shop";
}
.card {
  min-height: 0; background: var(--card); border: var(--cardBorder); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border-radius: var(--radius); padding: var(--cardPad); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; transition: background .4s;
}
#c-clock { grid-area: clock; justify-content: space-between; }
#c-timers { grid-area: timers; gap: 10px; }
#c-agenda { grid-area: agenda; }
#c-tasks { grid-area: tasks; gap: 6px; }
#c-shop { grid-area: shop; gap: 6px; }
.tabs { display: none; grid-area: tabs; padding: 4px; gap: 4px; border-radius: 16px; background: var(--card); border: var(--cardBorder); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: var(--shadow); }
.tabs button { flex: 1 1 0; border: 0; border-radius: 12px; background: transparent; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: #FFF; }
.tabs .n { font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums; }

@media (max-width: 1099px) {
  .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); grid-template-rows: 52px minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "clock tabs" "clock panel" "timers panel"; }
  .tabs { display: flex; }
  #c-agenda, #c-tasks, #c-shop { grid-area: panel; }
  .grid[data-tab="agenda"] #c-tasks, .grid[data-tab="agenda"] #c-shop,
  .grid[data-tab="tareas"] #c-agenda, .grid[data-tab="tareas"] #c-shop,
  .grid[data-tab="compras"] #c-agenda, .grid[data-tab="compras"] #c-tasks { display: none; }
  .pill.alarm { display: none; }
  .clock { font-size: 64px; }
  #c-clock { gap: 8px; overflow: hidden; }
  .fc div { padding: 6px 0; }
  .banner { padding: 6px 10px; }
  .banner .btn { height: 36px !important; }
  .chip { padding: 0 10px; }
}
@media (max-width: 699px) {
  body { overflow: auto; }
  #app { height: auto; min-height: 100dvh; }
  .top { flex-wrap: wrap; }
  .head-r { width: 100%; justify-content: flex-end; }
  .grid { display: flex; flex-direction: column; }
  .tabs { display: none !important; }
  #c-agenda, #c-tasks, #c-shop { display: flex !important; }
  .list { max-height: 420px; }
  #c-clock { gap: 16px; }
}

/* Card header */
.ch { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; }
.ch-l { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ch h2 { margin: 0; font-family: var(--display); font-size: 18px; font-weight: var(--headW); }
.ico { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ico.a { background: var(--accentTint); color: var(--accentText); }
.ico.g { background: var(--greenTint); color: var(--greenText); }
.ico.v { background: var(--violetTint); color: var(--violetText); }
.link { height: 44px; padding: 0 8px; border: 0; background: transparent; color: var(--accentText); font-size: 14px; font-weight: 600; white-space: nowrap; }
.list { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; overscroll-behavior: contain; }
.list.gap8 { gap: 8px; }
.empty { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px; text-align: center; color: var(--muted); font-size: 14px; }
.empty b { color: var(--text); font-size: 17px; }

/* Clock & weather */
.clock { font-family: var(--display); font-weight: var(--clockW); font-size: clamp(60px, 8vw, 112px); line-height: .95; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.wx-now { display: flex; align-items: center; gap: 14px; }
.wx-ic { width: clamp(48px, 5vw, 60px); height: clamp(48px, 5vw, 60px); flex-shrink: 0; border-radius: 18px; background: var(--sunBg); color: var(--sunFg); display: flex; align-items: center; justify-content: center; }
.temp { font-size: clamp(30px, 3.7vw, 44px); font-weight: 600; line-height: 1; letter-spacing: -.03em; }
.fc { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.fc div { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: clamp(6px, 1vw, 10px) 0; border-radius: 16px; background: var(--sub); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fc small { font-size: 13px; font-weight: 500; color: var(--muted); }
.fc i { font-style: normal; font-weight: 400; color: var(--muted); }

/* Segmented */
.seg { display: flex; padding: 4px; border-radius: 14px; background: var(--sub); gap: 4px; }
.seg button { height: 36px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.10); }

/* Timers */
.tm { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px 14px; border-radius: 18px; background: var(--sub); flex-shrink: 0; }
.tm.done { background: var(--orangeTint); }
.tm .lbl { font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm.done .lbl, .tm.done .big { color: var(--orange); }
.big { font-size: clamp(22px, 2.3vw, 26px); font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.rb { width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 0; background: var(--accent); color: #FFF; display: flex; align-items: center; justify-content: center; padding: 0; }
.rb.ghost { background: transparent; color: var(--muted); }
.rb.plain { background: var(--card); color: var(--text); }
.rb.warn { background: var(--orangeSolid); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > div { height: 100%; border-radius: 3px; background: var(--accent); transition: width 1s linear; }
.tm.paused .bar > div { background: var(--mutedBar); }
.tm.done .bar > div { background: var(--orangeSolid); }
.chip { height: 44px; padding: 0 11px; border-radius: 22px; border: 1px solid var(--line); background: transparent; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.al { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 18px; background: var(--sub); flex-shrink: 0; }
.al.off .big { color: var(--muted); }
.sw { position: relative; width: 56px; height: 44px; flex-shrink: 0; border: 0; background: transparent; padding: 0; }
.sw::before { content: ""; position: absolute; left: 2px; top: 6px; width: 52px; height: 32px; border-radius: 16px; background: var(--track); transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 9px; left: 5px; width: 26px; height: 26px; border-radius: 13px; background: #FFF; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s; }
.sw[aria-checked="true"]::before { background: var(--green); }
.sw[aria-checked="true"]::after { left: 26px; }
.tin { height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--sub); padding: 0 12px; }

/* Agenda */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; flex-shrink: 0; }
.days button { height: clamp(52px, 5.2vw, 62px); border-radius: 16px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; }
.days span { font-size: 12px; font-weight: 500; }
.days b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.days i { width: 5px; height: 5px; border-radius: 3px; background: transparent; }
.days .today { color: var(--accentText); }
.days .has i { background: var(--ring); }
.days [aria-pressed="true"] { background: var(--accent); color: #FFF; }
.days [aria-pressed="true"] i { background: #FFF; }
.ev { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--sub); flex-shrink: 0; }
.ev.next { background: var(--accentTint); }
.ev.past { opacity: .45; }
.ev .t { width: 52px; flex-shrink: 0; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ev .t.ad { font-size: 12px; line-height: 1.15; }
.ev .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
.ev .ti { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 12px; background: var(--accent); color: #FFF; white-space: nowrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; flex-shrink: 0; font-size: 13px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 6px; }

/* Lists */
.it { display: flex; align-items: center; gap: 6px; min-height: 50px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.ck { width: 44px; height: 44px; flex-shrink: 0; border: 0; background: transparent; padding: 0; margin-left: -8px; display: flex; align-items: center; justify-content: center; }
.ck span { width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--ring); color: #FFF; display: flex; align-items: center; justify-content: center; transition: background .2s; }
.shopl .ck span { border-radius: 8px; }

/* ---------------------------- API ---------------------------- */
async function apiGet(action, extra) {
  const s = S.settings;
  const url = s.apiUrl + (s.apiUrl.indexOf('?') >= 0 ? '&' : '?') + 'action=' + action + '&token=' + encodeURIComponent(s.token) + (extra || '');
  const r = await fetch(url, { method: 'GET', redirect: 'follow', cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function apiPost(action, payload) {
  const s = S.settings;
  const r = await fetch(s.apiUrl, { method: 'POST', redirect: 'follow', body: JSON.stringify(Object.assign({ token: s.token, action: action }, payload || {})) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j;
}

async function sync() {
  if (isDemo()) { renderHeader(); return; }
  if (S.sync.busy || S.sync.pending > 0) { S.sync.again = true; return; }
  S.sync.busy = true; S.sync.again = false;
  const gen = S.sync.gen || 0;
  try {
    const j = await apiGet('summary', '&days=' + (S.settings.days || 7));
    if (!j.ok) throw new Error(j.error === 'unauthorized' ? 'clave incorrecta' : (j.error || 'error'));
    // Solo aplicar si no hubo cambios locales mientras se descargaba
    if (S.sync.pending === 0 && (S.sync.gen || 0) === gen) {
      S.data = j.data;
      LS.set('cache', j.data);
    } else {
      S.sync.again = true;
    }
    S.sync.ok = true; S.sync.error = ''; S.sync.last = Date.now();
  } catch (e) {
    S.sync.ok = false; S.sync.error = e.message || String(e);
  } finally {
    S.sync.busy = false;
  }
  renderAgenda(); renderLists(); renderHeader(); renderTabs();
  if (S.sync.again && S.sync.pending === 0) { S.sync.again = false; setTimeout(sync, 300); }
}

async function mutate(fn) {
  S.sync.pending++;
  S.sync.gen = (S.sync.gen || 0) + 1;
  renderLists(); renderTabs();
  try {
    if (!isDemo()) await fn();
  } catch (e) {
    toast('No se pudo guardar: ' + (e.message || e));
  } finally {
    S.sync.pending--;
    if (isDemo()) {
      S.data.tasks.forEach(x => { delete x.pending; });
      S.data.shop.forEach(x => { delete x.pending; });
      renderLists(); renderTabs();
    } else if (S.sync.pending === 0) {
      sync();
    }
  }
}

function listOf(kind) { return kind === 'shop' ? S.data.shop : S.data.tasks; }

function addItem(kind, title, due) {
  title = cap(title);
  if (!title) return;
  const arr = listOf(kind);
  if (kind === 'shop') {
    const ex = arr.find(x => x.title.toLowerCase() === title.toLowerCase());
    if (ex && !ex.done) return;
    if (ex && ex.done) { toggleItem(kind, ex.id); return; }
  }
  const item = { id: 'tmp' + Date.now() + Math.random(), listId: kind, title: title, done: false, due: due || null, pending: true };
  arr.unshift(item);
  mutate(() => apiPost(kind === 'shop' ? 'addShop' : 'addTask', { title: title, due: due || null }));
}
function toggleItem(kind, id) {
  const it = listOf(kind).find(x => x.id === id);
  if (!it || String(id).indexOf('tmp') === 0) return;
  it.done = !it.done;
  mutate(() => apiPost('setDone', { listId: it.listId || kind, id: it.id, done: it.done }));
}
function clearDone(kind) {
  const arr = listOf(kind);
  const any = arr.some(x => x.done);
  if (!any) return;
  if (kind === 'shop') S.data.shop = arr.filter(x => !x.done); else S.data.tasks = arr.filter(x => !x.done);
  const listId = kind === 'shop' ? (S.data.shopListId || 'shop') : (S.data.taskListId || 'tasks');
  mutate(() => apiPost('clearDone', { listId: listId }));
}

/* ---------------------------- Clima (Open-Meteo) ---------------------------- */
const WMO = c => {
  if (c === 0) return ['Despejado', 'sun'];
  if (c === 1) return ['Mayormente despejado', 'partly'];
  if (c === 2) return ['Parcialmente nublado', 'partly'];
  if (c === 3) return ['Nublado', 'cloud'];
  if (c === 45 || c === 48) return ['Niebla', 'fog'];
  if (c >= 51 && c <= 57) return ['Llovizna', 'rain'];
  if (c >= 61 && c <= 67) return ['Lluvia', 'rain'];
  if (c >= 71 && c <= 77) return ['Nieve', 'snow'];
  if (c >= 80 && c <= 82) return ['Chaparrones', 'rain'];
  if (c === 85 || c === 86) return ['Nieve', 'snow'];
  if (c >= 95) return ['Tormenta', 'storm'];
  return ['—', 'cloud'];
};
async function loadWeather() {
  const s = S.settings;
  if (s.lat == null || s.lon == null) {
    if (isDemo()) {
      S.weather = { demo: true, temp: 32, code: 2, isDay: 1, max: 34, min: 23, daily: [{ c: 0, hi: 34, lo: 23 }, { c: 2, hi: 31, lo: 22 }, { c: 63, hi: 27, lo: 20 }, { c: 0, hi: 33, lo: 22 }, { c: 1, hi: 32, lo: 22 }] };
    } else {
      S.weather = null;
    }
    renderWeather();
    return;
  }
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + s.lat + '&longitude=' + s.lon +
      '&current=temperature_2m,weather_code,is_day,apparent_temperature&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=5';
    const r = await fetch(url, { cache: 'no-store' });
    const j = await r.json();
    S.weather = {
      temp: Math.round(j.current.temperature_2m), feels: Math.round(j.current.apparent_temperature), code: j.current.weather_code, isDay: j.current.is_day,
      max: Math.round(j.daily.temperature_2m_max[0]), min: Math.round(j.daily.temperature_2m_min[0]),
      rain: j.daily.precipitation_probability_max,
      daily: j.daily.weather_code.map((c, i) => ({ c: c, hi: Math.round(j.daily.temperature_2m_max[i]), lo: Math.round(j.daily.temperature_2m_min[i]), p: j.daily.precipitation_probability_max[i] })).slice(1)
    };
    LS.set('weather', S.weather);
  } catch (e) {
    S.weather = S.weather || LS.get('weather', null);
  }
  renderWeather();
}
function weatherIcon(code, isDay) {
  const k = WMO(code)[1];
  if (!isDay && (k === 'sun' || k === 'partly')) return 'moon';
  return k;
}

function xmasInfo(d) {
  const today = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (d.getMonth() === 0 && d.getDate() <= 6) return { days: 0, label: '¡Feliz año nuevo!' };
  let target = new Date(d.getFullYear(), 11, 25);
  if (today > target) return { days: 0, label: '¡Felices fiestas!' };
  const days = Math.round((target - today) / 86400000);
  return { days: days, label: days === 0 ? '¡Feliz Navidad!' : days === 1 ? 'día para Navidad' : 'días para Navidad' };
}
function syncText() {
  if (isDemo()) return 'Modo demo';
  if (S.sync.ok === false) return 'Sin conexión';
  if (!S.sync.last) return 'Conectando…';
  return 'Actualizado ' + hm(new Date(S.sync.last));
}

}

/* ---------------------------- Render: agenda ---------------------------- */
function eventsOn(dateKey) {
  return (S.data.events || []).filter(e => {
    if (e.allDay) return e.date <= dateKey && dateKey < (e.endDate || e.date + 'z');
    return ymd(new Date(e.start)) === dateKey;
  });
}
function renderAgenda() {
  const t = new Date();
  const nowMs = t.getTime();
  let days = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(t, i);
    const has = eventsOn(ymd(d)).length > 0;
    days += '<button data-act="day" data-arg="' + i + '" aria-pressed="' + (S.ui.day === i) + '" aria-label="' + DL[d.getDay()] + ' ' + d.getDate() + '" class="' + (i === 0 ? 'today ' : '') + (has ? 'has' : '') + '"><span>' + (i === 0 ? 'Hoy' : DS[d.getDay()]) + '</span><b>' + d.getDate() + '</b><i></i></button>';
  }
  $('days').innerHTML = days;
  const sd = addDays(t, S.ui.day);
  $('day-label').textContent = S.ui.day === 0 ? 'Hoy' : S.ui.day === 1 ? 'Mañana' : DL[sd.getDay()] + ' ' + sd.getDate();

  const list = eventsOn(ymd(sd));
  let nextGiven = false;
  const html = list.map(e => {
    let cls = '', badge = '', tcell;
    if (e.allDay) {
      tcell = '<span class="t ad">Todo el día</span>';
    } else {
      const st = new Date(e.start), en = new Date(e.end);
      tcell = '<span class="t">' + hm(st) + '</span>';
      if (S.ui.day === 0) {
        if (en.getTime() <= nowMs) cls = 'past';
        else if (st.getTime() <= nowMs) { cls = 'next'; badge = 'Ahora'; nextGiven = true; }
        else if (!nextGiven) {
          const diff = Math.round((st.getTime() - nowMs) / 60000);
          badge = diff < 60 ? 'en ' + diff + ' min' : 'en ' + Math.round(diff / 60) + ' h';
          cls = 'next'; nextGiven = true;
        }
      }
    }
    return '<div class="ev ' + cls + '">' + tcell + '<span class="dot" style="width:10px;height:10px;border-radius:5px;background:' + esc(e.color || 'var(--accent)') + '"></span>' +
      '<div class="tx"><span class="ti">' + esc(e.title) + '</span><span class="muted small">' + esc(e.calendar || '') + (e.location ? ' · ' + esc(e.location) : '') + '</span></div>' +
      (badge ? '<span class="badge">' + badge + '</span>' : '') + '</div>';
  }).join('');
  $('events').innerHTML = html || '<div class="empty"><b>Día libre</b>No hay eventos para este día.</div>';
  $('legend').innerHTML = (S.data.calendars || []).slice(0, 6).map(c => '<span><span class="dot" style="background:' + esc(c.color) + '"></span>' + esc(c.name) + '</span>').join('');
}

/* ---------------------------- Render: tareas y compras ---------------------------- */
function dueLabel(due) {
  if (!due) return null;
  const today = ymd(new Date());
  const tom = ymd(addDays(new Date(), 1));
  const [y, m, d] = due.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  if (due < today) return { t: 'Vencida · ' + d + '/' + m, late: true };
  if (due === today) return { t: 'Hoy', late: false };
  if (due === tom) return { t: 'Mañana', late: false };
  const diff = Math.round((dt - new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate())) / 86400000);
  return { t: diff < 7 ? DL[dt.getDay()] : d + '/' + m, late: false };
}
function sortItems(arr) {
  return arr.slice().sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const da = a.due || '9999', db = b.due || '9999';
    return da < db ? -1 : da > db ? 1 : 0;
  });
}
function renderList(kind) {
  const arr = sortItems(listOf(kind));
  const el = $(kind === 'shop' ? 'shop' : 'tasks');
  el.innerHTML = arr.map(x => {
    const dl = kind === 'tasks' ? dueLabel(x.due) : null;
    return '<div class="it' + (x.done ? ' done' : '') + (x.pending ? ' pending' : '') + '">' +
      '<button class="ck" data-act="toggle" data-kind="' + kind + '" data-arg="' + esc(x.id) + '" aria-label="' + (x.done ? 'Marcar pendiente: ' : 'Completar: ') + esc(x.title) + '"><span>' + (x.done ? ic('check', 15, 3) : '') + '</span></button>' +
      '<div class="tx"><span class="ti">' + esc(x.title) + '</span>' + (dl ? '<span class="mt' + (dl.late && !x.done ? ' late' : '') + '">' + dl.t + '</span>' : '') + '</div></div>';
  }).join('') || '<div class="empty"><b>' + (kind === 'shop' ? 'Nada para comprar' : 'Todo hecho') + '</b>' + (kind === 'shop' ? 'Agregá algo o decí “agregá leche a la lista”.' : 'Agregá una tarea o decí “recordame…”.') + '</div>';
  const pend = arr.filter(x => !x.done).length;
  $(kind === 'shop' ? 'shop-n' : 'tasks-n').textContent = kind === 'shop' ? (pend === 1 ? '1 por comprar' : pend + ' por comprar') : (pend === 1 ? '1 pendiente' : pend + ' pendientes');
  $(kind === 'shop' ? 'shop-clear' : 'tasks-clear').hidden = !arr.some(x => x.done);
}
function renderLists() { renderList('tasks'); renderList('shop'); }

function renderTabs() {
  const t = new Date();
  const left = eventsOn(ymd(t)).filter(e => e.allDay || new Date(e.end).getTime() > Date.now()).length;
  const defs = [['agenda', 'Agenda', left], ['tareas', 'Tareas', S.data.tasks.filter(x => !x.done).length], ['compras', 'Compras', S.data.shop.filter(x => !x.done).length]];
  $('tabs').innerHTML = defs.map(d => '<button role="tab" data-act="tab" data-arg="' + d[0] + '" aria-selected="' + (S.ui.tab === d[0]) + '">' + d[1] + '<span class="n">' + d[2] + '</span></button>').join('');
  $('grid').dataset.tab = S.ui.tab;
}

/* ---------------------------- Timers y alarmas ---------------------------- */
function remaining(t) { return t.st === 'run' ? Math.max(0, Math.ceil((t.endAt - Date.now()) / 1000)) : t.rem; }
function fmtSecs(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
}
function addTimer(secs, label) {
  S.timers.push({ id: 't' + Date.now(), label: label || (Math.round(secs / 60) + ' min'), total: secs, rem: secs, endAt: Date.now() + secs * 1000, st: 'run' });
  saveTimers(); S.ui.ta = 'timers'; renderTimersCard();
}
function timerToggle(id) {
  const t = S.timers.find(x => x.id === id);
  if (!t) return;
  if (t.st === 'run') { t.rem = remaining(t); t.st = 'pause'; }
  else if (t.st === 'pause') { t.endAt = Date.now() + t.rem * 1000; t.st = 'run'; }
  else { t.rem = t.total; t.endAt = Date.now() + t.total * 1000; t.st = 'run'; }
  saveTimers(); renderTimersCard();
}
function nextAlarm() {
  const on = S.alarms.filter(a => a.on).sort((a, b) => a.time < b.time ? -1 : 1);
  if (!on.length) return null;
  const now = hm(new Date());
  return on.find(a => a.time > now) || on[0];
}
function daysText(a) {
  if (!a.days || !a.days.length) return 'Una vez';
  const k = a.days.slice().sort().join(',');
  if (k === '1,2,3,4,5') return 'Lun a Vie';
  if (k === '0,6') return 'Sáb y Dom';
  if (a.days.length === 7) return 'Todos los días';
  return a.days.map(x => DS[x]).join(' ');
}
function renderTimersCard() {
  const isT = S.ui.ta === 'timers';
  $('seg-t').setAttribute('aria-pressed', isT);
  $('seg-a').setAttribute('aria-pressed', !isT);
  if (isT) {
    $('ta-list').innerHTML = S.timers.map(t => {
      const r = remaining(t);
      const st = t.st === 'done' ? '¡Listo!' : t.st === 'run' ? 'En curso' : 'En pausa';
      const icn = t.st === 'done' ? ic('reset', 18, 2.4) : t.st === 'run' ? ic('pause', 18, 2.4) : ic('play', 18, 2, 'currentColor');
      const lab = (t.st === 'done' ? 'Reiniciar ' : t.st === 'run' ? 'Pausar ' : 'Iniciar ') + t.label;
      return '<div class="tm ' + (t.st === 'done' ? 'done' : t.st === 'pause' ? 'paused' : '') + '" data-tid="' + t.id + '">' +
        '<div class="row" style="gap:8px"><div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column"><span class="lbl">' + esc(t.label) + ' · ' + st + '</span><span class="big" data-disp>' + fmtSecs(r) + '</span></div>' +
        '<button class="rb ' + (t.st === 'run' ? 'plain' : t.st === 'done' ? 'warn' : '') + '" data-act="ttoggle" data-arg="' + t.id + '" aria-label="' + esc(lab) + '">' + icn + '</button>' +
        '<button class="rb ghost" data-act="tremove" data-arg="' + t.id + '" aria-label="Quitar ' + esc(t.label) + '">' + ic('x', 18) + '</button></div>' +
        '<div class="bar"><div data-bar style="width:' + (t.total ? Math.min(100, (t.total - r) / t.total * 100) : 0) + '%"></div></div></div>';
    }).join('') || '<div class="empty">Sin timers activos. Tocá un tiempo rápido o pedíselo por voz.</div>';
    $('ta-foot').innerHTML = [1, 5, 10, 15].map(n => '<button class="chip" data-act="preset" data-arg="' + n + '">' + ic('plus', 14, 2.4) + n + ' min</button>').join('');
    const run = S.timers.filter(t => t.st === 'run').length;
    $('ta-sum').textContent = run + ' en curso';
  } else {
    $('ta-list').innerHTML = S.alarms.slice().sort((a, b) => a.time < b.time ? -1 : 1).map(a =>
      '<div class="al' + (a.on ? '' : ' off') + '"><div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column"><span class="big">' + a.time + '</span><span class="muted small">' + esc(a.label) + ' · ' + daysText(a) + '</span></div>' +

let actx = null, beepTimer = null;
function unlockAudio() {
  try {

    if (actx.state === 'suspended') actx.resume();
  } catch (e) { /* sin audio */ }
}
function beep() {
  if (!actx) return;
  const t0 = actx.currentTime;
  [0, 0.22, 0.44].forEach((off, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = i === 2 ? 1046 : 880;
    g.gain.setValueAtTime(0.0001, t0 + off);
    g.gain.exponentialRampToValueAtTime(0.35, t0 + off + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.18);
    o.connect(g); g.connect(actx.destination);
    o.start(t0 + off); o.stop(t0 + off + 0.2);
  });
}
function ring(title, label, alarm) {

    if (!S.ui.ring || Date.now() - S.ui.ring.since > 5 * 60000) { stopRing(); return; }

// FullScreendy (kiosco en la tablet) expone su propio puente de voz: la WebView de Android no trae speechSynthesis.
const FSD = window.fullscreendy && typeof window.fullscreendy.textToSpeech === 'function' ? window.fullscreendy : null;

const MES = { base: 'https://cdn.jsdelivr.net/npm/mespeak@2.0.2/', m: null, loading: null, src: null };
async function mesLoad() {
  if (MES.m) return MES.m;
  if (!MES.loading) MES.loading = (async () => {
    const mod = await import(MES.base + '+esm');
    const m = mod.default || mod;
    m.loadConfig(await (await fetch(MES.base + 'src/mespeak_config.json')).json());
    m.loadVoice(await (await fetch(MES.base + 'voices/es-la.json')).json());

  })();

}
// Dice los números como palabras simples para que eSpeak no lea "09:30" raro.
function speakText(t) {
  return String(t).replace(/(\d{1,2}):(\d{2})/g, (x, h, mm) => +h + (mm === '00' ? '' : ' y ' + +mm)).replace(/°/g, ' grados').replace(/[“”"]/g, '');
}
async function speak(text) {
  if (!S.settings.speak || !text) return;
  if (window.speechSynthesis && !FSD && !(BOOT && BOOT.kiosk)) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-ES'; u.rate = 1.02;
      const v = speechSynthesis.getVoices().find(x => /^es/i.test(x.lang));
      if (v) { u.voice = v; speechSynthesis.speak(u); return; }
    } catch (e) { /* sigue con eSpeak */ }
  }
  try {
    unlockAudio(); if (!actx) return;
    let buf = null;
    if (!isDemo()) {
      try {
        const t0 = Date.now();
        const r = await Promise.race([apiPost('tts', { text: String(text).slice(0, 300) }), new Promise((_, ko) => setTimeout(() => ko(new Error('tiempo')), 12000))]);
        const bin = atob(r.audio), u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        buf = await actx.decodeAudioData(u8.buffer);
        jvLog('voz gemini', Date.now() - t0);
      } catch (e) { jvLog('voz gemini error', String(e.message || e)); }
    }
    if (!buf) {
      const m = await mesLoad();
      const raw = m.speak(speakText(text), { voice: 'es-la', rawdata: 'array', speed: 150, pitch: 45, wordgap: 1 });
      if (!raw || !raw.length) return;
      buf = await actx.decodeAudioData(new Uint8Array(raw).buffer);
    }
    try { if (MES.src) MES.src.stop(); } catch (e) { /* nada */ }
    const src = actx.createBufferSource(); const g = actx.createGain(); g.gain.value = 0.9;
    src.buffer = buf; src.connect(g); g.connect(actx.destination); src.start();

    JV.mute = Date.now() + buf.duration * 1000 + 400;

}
function openVoice() {
  S.ui.sheet = { kind: 'voice', phase: 'listen', heard: '', reply: '' };

}
function startListening() {
  if (!SR) {
    S.ui.sheet.phase = 'idle';
    S.ui.sheet.note = 'Escribí el comando abajo (este dispositivo no tiene reconocimiento de voz).';
    renderOverlay();
    return;
  }
  try { if (rec) rec.abort(); } catch (e) { /* nada */ }
  rec = new SR();
  rec.lang = S.settings.lang || 'es-PY';
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  let finalText = '';
  rec.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    const sh = S.ui.sheet;
    if (sh && sh.kind === 'voice') { sh.heard = (finalText || interim).trim(); const el = $('v-heard'); if (el) el.textContent = sh.heard ? '“' + sh.heard + '”' : ''; }
  };
  rec.onerror = ev => {
    const sh = S.ui.sheet;

    if (ev.error === 'language-not-supported' && rec.lang !== 'es-ES') { S.settings.lang = 'es-ES'; saveSettings(); startListening(); return; }

    sh.phase = 'idle'; renderOverlay();

    const sh = S.ui.sheet;

    if (finalText.trim()) runCommand(finalText.trim());

}
async function runCommand(text) {

  if (S.ui.sheet && S.ui.sheet.kind === 'voice') { S.ui.sheet.reply = reply; renderOverlay(); }
  // Acciones: pitido de confirmación (rápido). Preguntas (hora, clima, agenda…): respuesta hablada.
  if (/^(Agregu[eé]|Timer de|Alarma para|Anotado|Listo|Tach[eé]|Activando|Agend[eé])/.test(reply)) { if (!/apagu[eé]/.test(reply)) { unlockAudio(); beep(); } }

const NUMW = { un: 1, una: 1, uno: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, doce: 12, quince: 15, veinte: 20, treinta: 30, cuarenta: 40, cincuenta: 50 };
const WD = { domingo: 0, lunes: 1, martes: 2, 'miércoles': 3, miercoles: 3, jueves: 4, viernes: 5, 'sábado': 6, sabado: 6 };
function parseDue(str) {
  let txt = ' ' + str + ' ';
  let due = null;
  const t = new Date();
  if (/\spasado ma[nñ]ana\s/.test(txt)) { due = ymd(addDays(t, 2)); txt = txt.replace(/\spasado ma[nñ]ana\s/, ' '); }
  else if (/\sma[nñ]ana\s/.test(txt)) { due = ymd(addDays(t, 1)); txt = txt.replace(/\sma[nñ]ana\s/, ' '); }
  else if (/\shoy\s/.test(txt)) { due = ymd(t); txt = txt.replace(/\shoy\s/, ' '); }
  const wm = txt.match(/\s(?:el\s)?(domingo|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado)\s/);
  if (!due && wm) {
    const target = WD[wm[1]];
    let diff = (target - t.getDay() + 7) % 7; if (diff === 0) diff = 7;
    due = ymd(addDays(t, diff)); txt = txt.replace(wm[0], ' ');
  }
  const tm = txt.match(/\s(?:a\s+las?|a\s+la)\s+(\d{1,2})(?:[:.](\d{2}))?(?:\s*(?:hs|horas))?(?:\s+de la (?:tarde|noche|ma[nñ]ana))?/);
  if (tm) { txt = txt.replace(tm[0], ' '); if (!due) due = ymd(t); }
  return { text: txt.replace(/\s+/g, ' ').trim(), due: due };
}
const joinList = arr => arr.length > 1 ? arr.slice(0, -1).join(', ') + ' y ' + arr[arr.length - 1] : arr[0];

// El dictado por voz escribe los números con letras: "siete y media" -> "7:30", "diez minutos" -> "10 minutos".
function numWords(q) {
  const U = { dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20, veintiuno: 21, veintiun: 21, veintidos: 22, veintitres: 23, veinticuatro: 24, veinticinco: 25, veintiseis: 26, veintisiete: 27, veintiocho: 28, veintinueve: 29 };
  const T = { treinta: 30, cuarenta: 40, cincuenta: 50, sesenta: 60, setenta: 70, ochenta: 80, noventa: 90 };
  const one = Object.assign({ un: 1, uno: 1, una: 1 }, U);
  q = q.replace(/dieciséis/g, 'dieciseis').replace(/veintidós/g, 'veintidos').replace(/veintitrés/g, 'veintitres').replace(/veintiséis/g, 'veintiseis').replace(/veintiún/g, 'veintiun');
  q = q.replace(new RegExp('\\b(' + Object.keys(T).join('|') + ')(?: y (' + Object.keys(one).join('|') + '))?\\b', 'g'), (m, t, u) => String(T[t] + (u ? one[u] : 0)));
  q = q.replace(new RegExp('\\b(' + Object.keys(U).join('|') + ')\\b', 'g'), m => String(U[m]));
  if (/(alarma|despert)/.test(q)) {
    q = q.replace(/\ba la una\b/g, 'a la 1').replace(/\b(\d{1,2}) y media\b/g, '$1:30').replace(/\b(\d{1,2}) y cuarto\b/g, '$1:15')
         .replace(/\b(\d{1,2}) y (\d{1,2})\b/g, (m, a, b) => a + ':' + pad(b)).replace(/\b(\d{1,2}) en punto\b/g, '$1:00');
  }
  return q;
}
function findItem(list, what) {
  const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9ñ ]/g, ' ').replace(/\s+/g, ' ').trim();
  const w = norm(what).split(' ').filter(x => x.length > 2 && !/^(los|las|del|que|para|con|una|uno)$/.test(x));
  const open = list.filter(x => !x.done);
  return open.find(x => norm(x.title) === norm(what)) || open.find(x => w.length && w.every(k => norm(x.title).includes(k))) || open.find(x => w.length && w.some(k => k.length > 3 && norm(x.title).includes(k)));
}
async function handleCommand(raw) {
  let q = raw.toLowerCase().replace(/[¿?¡!.]/g, ' ').replace(/\s+/g, ' ').trim();
  const pm = q.match(/^(alexa|ok google|oye google|hey google|google|hey jarvis|oye jarvis|jarvis)\s*,?\s*/);
  if (pm) q = q.slice(pm[0].length);
  q = numWords(q);
  const stopWords = /^(par[aá]|para ya|apag[aá]|basta|listo|silencio|stop|ok|ya est[aá]|cort[aá])(?=\s|$)/;
  if (S.ui.ring && (stopWords.test(q) || /(par[aá]|apag[aá]).*(alarma|timer|temporizador)/.test(q))) { stopRing(); return 'Listo, lo apagué.'; }
  if (stopWords.test(q) && q.split(' ').length <= 3) return 'Listo.';
  const numRe = '\\b(\\d+|' + Object.keys(NUMW).join('|') + ')';
  let m;

  // Temas
  if ((m = q.match(/(?:tema|modo|estilo)\s+(navide[nñ]o|navidad|verano|cl[aá]sico|noche|oscuro|claro|smart display|asistente|material|cristal|autom[aá]tico)/))) {
    const map = { 'navideño': 'navidad', navideno: 'navidad', navidad: 'navidad', verano: 'verano', 'clásico': 'clasico', clasico: 'clasico', claro: 'clasico', noche: 'noche', oscuro: 'noche', 'smart display': 'asistente', asistente: 'asistente', material: 'material', cristal: 'cristal', 'automático': 'auto', automatico: 'auto' };
    S.settings.theme = map[m[1]] || 'auto'; saveSettings(); applyTheme();
    return 'Listo, tema ' + (S.settings.theme === 'auto' ? 'automático' : THEMES[S.settings.theme].name) + '.';
  }
  // Modo ambiente
  if (/(modo ambiente|protector|pantalla de descanso)/.test(q)) { setTimeout(enterAmbient, 1500); return 'Activando modo ambiente.'; }

  if (/(timer|temporizador|cron[oó]metro)/.test(q) && (m = q.match(new RegExp(numRe + '\\s*(segundos?|seg|minutos?|min|horas?|hs?)\\b')))) {
    const n = /\d/.test(m[1]) ? parseInt(m[1], 10) : NUMW[m[1]];
    const c0 = m[2].charAt(0);
    const u = c0 === 's' ? 1 : c0 === 'h' ? 3600 : 60;
    const unit = u === 1 ? 'seg' : u === 60 ? 'min' : (n === 1 ? 'hora' : 'horas');
    const lm = q.match(/para (?:el |la |los |las )?(.+)$/);
    addTimer(n * u, lm ? cap(lm[1]) : n + ' ' + unit);
    return 'Timer de ' + n + ' ' + unit + (lm ? ' para ' + lm[1] : '') + ' en marcha.';
  }
  if (/(cancel[aá]|par[aá]|deten[eé]|borr[aá]|sac[aá]|quit[aá]).*(timer|temporizador)/.test(q)) {
    const lm = q.match(/(?:timer|temporizador)\s+(?:de\s+|del\s+|para\s+)?(?:los\s+|las\s+|el\s+|la\s+)?(.+)$/);
    if (lm && !/^(todos|los timers|todo)$/.test(lm[1])) {
      const t = findItem(S.timers.map(x => ({ id: x.id, title: x.label })), lm[1]);
      if (t) { S.timers = S.timers.filter(x => x.id !== t.id); saveTimers(); renderTimersCard(); return 'Listo, quité el timer ' + t.title + '.'; }
    }
    const n = S.timers.length; S.timers = []; saveTimers(); renderTimersCard();
    return n ? 'Listo, quité ' + (n === 1 ? 'el timer.' : 'los ' + n + ' timers.') : 'No había timers.';
  }
  if (/(cancel[aá]|borr[aá]|sac[aá]|quit[aá]|elimin[aá]|desactiv[aá]).*(alarma)/.test(q)) {
    const tm = q.match(/\b(\d{1,2})(?::(\d{2}))?\b/);
    const before = S.alarms.length;
    if (tm) { const t = pad(+tm[1]) + ':' + (tm[2] || '00'); S.alarms = S.alarms.filter(a => a.time !== t); }
    else if (/todas/.test(q)) S.alarms = [];
    else { const nx = nextAlarm(); if (nx) S.alarms = S.alarms.filter(a => a !== (nx.a || nx)); }
    saveAlarms(); renderTimersCard(); renderHeader();
    return before > S.alarms.length ? 'Listo, quité ' + (before - S.alarms.length === 1 ? 'la alarma.' : 'las alarmas.') : 'No encontré esa alarma.';
  }

    const time = pad(h % 24) + ':' + (m[2] || '00');
    const days = /(todos los d[ií]as)/.test(q) ? [0, 1, 2, 3, 4, 5, 6] : /(lunes a viernes|d[ií]as de semana|semana)/.test(q) ? [1, 2, 3, 4, 5] : [];
    S.alarms.push({ id: 'a' + Date.now(), time: time, label: 'Alarma', days: days, on: true }); saveAlarms();
    S.ui.ta = 'alarms'; renderTimersCard(); renderHeader();
    return 'Alarma para las ' + time + (days.length ? ' (' + daysText({ days: days }) + ')' : '') + '.';
  }
  // Compras: agregar
  if ((m = q.match(/(?:agreg[aá]r?|a[nñ]ad[ií]r?|sum[aá]r?|pon[eé]r?|anot[aá]r?)\s+(.+?)\s+(?:a|en)\s+(?:la\s+|mi\s+)?(?:lista|compras|s[uú]per)/)) || (m = q.match(/^(?:hay que |tenemos que |falta )?compr(?:ar|á)\s+(.+)$/))) {
    const items = m[1].split(/\s*,\s*|\s+y\s+/).map(x => x.trim()).filter(Boolean);
    items.forEach(x => addItem('shop', x));

  }
  // Compras: quitar
  if ((m = q.match(/(?:sac[aá]|quit[aá]|borr[aá]|elimin[aá]|tach[aá])\s+(?:el |la |los |las )?(.+?)\s+de\s+(?:la\s+)?(?:lista|compras)/))) {
    const it = findItem(S.data.shop, m[1]);
    if (!it) return 'No encontré ' + m[1] + ' en Compras.';
    toggleItem('shop', it.id); renderLists();
    return 'Listo, taché ' + it.title + '.';
  }
  if (/(qu[eé] (hay que|tengo que|falta) comprar|lista de compras)/.test(q)) {

    S.ui.tab = 'compras'; renderTabs();
    return p.length ? 'En Compras hay: ' + joinList(p) + '.' : 'La lista de compras está vacía.';
  }

    return 'No encontré ' + m[1] + ' en tus tareas.';

      const rec = new JV.model.KaldiRecognizer(JV.RATE); let text = ''; const t3 = performance.now(); let fin;
      const done = new Promise(r => { fin = r; });
      let sent = false;
      rec.on('result', m => { text += ' ' + ((m.result && m.result.text) || ''); if (sent) fin(); });
      for (let i = 0; i < a.length; i += 4000) rec.acceptWaveformFloat(a.slice(i, i + 4000), JV.RATE);
      sent = true; rec.retrieveFinalResult();
      await Promise.race([done, new Promise(r => setTimeout(r, 60000))]);
      let reply = ''; const t = text.trim();
      if (/[?&]jvrun=1/.test(location.search) && t) { try { reply = await handleCommand(t); } catch (e) { reply = 'ERROR ' + e.message; } }
      await log({ file: name, vosk: t, ms: Math.round(performance.now() - t3), audio_ms: Math.round(a.length / 16), reply: reply });
      rec.remove();
    }
    await log({ step: 'fin', heap: performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) + ' MB' : '' });
  } catch (e) { await log({ error: String(e && e.stack || e) }); }
}

async function testConnection() {
  const url = ($('s-url') || {}).value, token = ($('s-token') || {}).value;
  const sh = S.ui.sheet;
  if (!url || !token) { sh.status = 'Completá URL y clave.'; sh.statusOk = false; return updateStatus(); }
  sh.status = 'Probando…'; sh.statusOk = null; updateStatus();
  const backup = { apiUrl: S.settings.apiUrl, token: S.settings.token };
  S.settings.apiUrl = url.trim(); S.settings.token = token.trim();
  try {
    const j = await apiGet('summary', '&days=7');
    if (!j.ok) throw new Error(j.error === 'unauthorized' ? 'clave incorrecta' : j.error);
    sh.status = 'Conectado ✓ ' + j.data.events.length + ' eventos · ' + j.data.tasks.filter(x => !x.done).length + ' tareas · ' + j.data.shop.filter(x => !x.done).length + ' compras';
    sh.statusOk = true;
  } catch (e) {
    sh.status = 'Error: ' + (e.message || e); sh.statusOk = false;
  }
  S.settings.apiUrl = backup.apiUrl; S.settings.token = backup.token;

function updateStatus() {
  const el = $('s-status');

async function findCity() {
  const name = ($('s-city') || {}).value;
  if (!name) return;
  const sh = S.ui.sheet;
  try {
    const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=es&name=' + encodeURIComponent(name));
    const j = await r.json();
    const g = j.results && j.results[0];
    if (!g) throw new Error('no encontré esa ciudad');
    sh.pendingLoc = { lat: g.latitude, lon: g.longitude, place: g.name + (g.admin1 ? ', ' + g.admin1 : '') + (g.country ? ', ' + g.country : '') };
    $('s-city').value = sh.pendingLoc.place;
    sh.status = 'Ubicación: ' + sh.pendingLoc.place + ' (tocá Guardar)'; sh.statusOk = true;
  } catch (e) { sh.status = 'Clima: ' + (e.message || e); sh.statusOk = false; }

function useGps() {
  const sh = S.ui.sheet;
  if (!navigator.geolocation) { sh.status = 'Este dispositivo no da ubicación.'; sh.statusOk = false; return updateStatus(); }
  sh.status = 'Buscando ubicación…'; sh.statusOk = null; updateStatus();
  navigator.geolocation.getCurrentPosition(p => {
    sh.pendingLoc = { lat: Math.round(p.coords.latitude * 1000) / 1000, lon: Math.round(p.coords.longitude * 1000) / 1000, place: 'Ubicación del dispositivo' };
    if ($('s-city')) $('s-city').value = sh.pendingLoc.place;
    sh.status = 'Ubicación lista (tocá Guardar)'; sh.statusOk = true; updateStatus();
  }, err => { sh.status = 'No se pudo obtener la ubicación (' + err.message + ')'; sh.statusOk = false; updateStatus(); }, { timeout: 15000 });
}
