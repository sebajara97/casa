<style>
/* Panel estilo Echo Show / Nest Hub. Lienzo fijo de 1280×800 escalado a la pantalla:
   se ve igual en la tablet de 8" y en una de 10". Solo transform/opacity animan (GPU). */
:root {
  --bg: #0B0E13; --card: #161B23; --panel: #12161D; --hi: #1C2330; --line: #232A36;
  --text: #F2F4F7; --soft: #C9D1DC; --muted: #9AA4B2; --dim: #6E7887;
  --blue: #5B9BFF; --blueSoft: #9DB8FF; --green: #3ECF8E; --orange: #FFB86B; --violet: #8F8CFF; --red: #FF7A7A;
  --display: Outfit, Inter, system-ui, sans-serif; --font: Inter, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { color: var(--text); font-family: var(--font); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button, input, select { font-family: inherit; color: inherit; }
button { cursor: pointer; }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }
#track { display: flex; width: 5120px; height: 800px; will-change: transform; transform: translate3d(0,0,0); touch-action: pan-y; }
#track.anim { transition: transform 360ms cubic-bezier(.2,.8,.2,1); }
.pg { width: 1280px; height: 800px; flex-shrink: 0; padding: 40px 52px 76px; display: flex; gap: 36px; contain: layout paint; }

/* Inicio */
.left { width: 560px; display: flex; flex-direction: column; gap: 24px; }
#clock { font-family: var(--display); font-weight: 200; font-size: 176px; line-height: .95; letter-spacing: -4px; }
#date { font-size: 34px; font-weight: 500; color: var(--soft); }
.wx { display: flex; align-items: center; gap: 22px; }
#wx-ic { color: var(--orange); width: 96px; height: 96px; }
#wx-ic svg { width: 96px; height: 96px; stroke-width: 1.5; }
#wx-temp { font-family: var(--display); font-weight: 300; font-size: 84px; line-height: 1; }
#wx-desc { font-size: 26px; color: var(--soft); }
.cards { margin-top: auto; display: flex; gap: 18px; }
.card { background: var(--card); border-radius: 28px; padding: 22px 26px; display: flex; flex-direction: column; gap: 8px; min-width: 0; border: 0; text-align: left; }
.card .lbl { display: flex; align-items: center; gap: 10px; font-size: 23px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .big { font-family: var(--display); font-size: 62px; font-weight: 400; line-height: 1; }
.bar { height: 10px; border-radius: 5px; background: #2A313C; overflow: hidden; }
.bar > div { height: 100%; background: var(--blue); border-radius: 5px; }
.right { flex: 1; min-width: 0; background: var(--panel); border-radius: 36px; padding: 30px 34px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.hrow { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
h2 { margin: 0; font-size: 40px; font-weight: 600; }
h3 { margin: 8px 0 0; font-size: 28px; font-weight: 600; color: var(--soft); }
.meta { font-size: 24px; color: var(--muted); }
.ev { display: flex; gap: 20px; align-items: center; padding: 16px 22px; border-radius: 22px; }
.ev.next { background: var(--hi); }
.ev .dot { width: 9px; align-self: stretch; border-radius: 5px; flex-shrink: 0; }
.ev .t { font-family: var(--display); font-size: 38px; font-weight: 500; width: 112px; flex-shrink: 0; }
.ev .t.ad { font-size: 22px; font-family: var(--font); color: var(--soft); }
.ev .n { font-size: 30px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .s { font-size: 22px; color: var(--blueSoft); }
.empty { font-size: 28px; color: var(--muted); padding: 18px 4px; }

/* Listas */
.col { flex: 1; min-width: 0; background: var(--panel); border-radius: 36px; padding: 28px 32px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
.items { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.it { display: flex; align-items: center; gap: 20px; width: 100%; min-height: 72px; padding: 8px 4px; background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: left; }
.box { width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px; border: 3px solid #5B6574; display: flex; align-items: center; justify-content: center; }
.it.done .box { background: var(--green); border: 0; color: #0B0E13; }
.it .tx { font-size: 32px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.it.done .tx { color: var(--dim); text-decoration: line-through; }
.it .due { font-size: 20px; color: var(--muted); flex-shrink: 0; }
.it .due.late { color: var(--red); }
.add { display: flex; gap: 12px; margin-top: 12px; }
.add input { flex: 1; min-width: 0; height: 64px; border-radius: 20px; border: 2px solid var(--line); background: var(--bg); padding: 0 20px; font-size: 26px; }
.add input::placeholder { color: var(--dim); }
.btn { height: 64px; min-width: 64px; border-radius: 20px; border: 0; background: var(--hi); font-size: 24px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; }
.btn.pri { background: var(--blue); color: #08111F; }
.link { background: none; border: 0; color: var(--blueSoft); font-size: 22px; padding: 6px 0; }

/* Semana */
.fc { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.fd { background: var(--card); border-radius: 24px; padding: 18px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.fd .d { font-size: 24px; color: var(--soft); font-weight: 600; }
.fd svg { width: 52px; height: 52px; }
.fd .h { font-family: var(--display); font-size: 40px; }
.fd .l { font-size: 22px; color: var(--muted); }
.fd .p { font-size: 20px; color: var(--blueSoft); }
.wk { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; overflow: hidden; }
.wd { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wd .dh { font-size: 24px; font-weight: 600; color: var(--soft); }
.wd .we { font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wd .we b { font-family: var(--display); font-weight: 500; color: var(--blueSoft); margin-right: 10px; }
.wd .none { font-size: 22px; color: var(--dim); }

/* Timers y alarmas */
.presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.pre { height: 92px; border-radius: 24px; border: 0; background: var(--card); font-family: var(--display); font-size: 38px; }
.tm { background: var(--card); border-radius: 24px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; }
.tm .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.tm .lbl { font-size: 22px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm .big { font-family: var(--display); font-size: 52px; line-height: 1; }
.tm.done .big { color: var(--orange); }
.rb { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--hi); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.al { display: flex; align-items: center; gap: 16px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.al .big { font-family: var(--display); font-size: 48px; }
.al.off .big { color: var(--dim); }
.sw { width: 84px; height: 48px; border-radius: 24px; border: 0; background: #39414D; position: relative; flex-shrink: 0; }
.sw::after { content: ''; position: absolute; top: 5px; left: 5px; width: 38px; height: 38px; border-radius: 50%; background: #F2F4F7; transition: transform 200ms; }
.sw[aria-checked="true"] { background: var(--green); }
.sw[aria-checked="true"]::after { transform: translateX(36px); }
.tin { height: 64px; border-radius: 20px; border: 2px solid var(--line); background: var(--bg); font-size: 26px; padding: 0 14px; }

/* Barra superior y puntos */
#top { position: absolute; bottom: 4px; right: 24px; display: flex; align-items: center; gap: 14px; z-index: 3; }
#status { font-size: 18px; color: var(--dim); }
#mic { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--card); color: var(--blueSoft); display: flex; align-items: center; justify-content: center; }
#dots { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 14px; z-index: 3; }
#dots button { width: 14px; height: 14px; border-radius: 7px; border: 0; padding: 0; background: #4A5361; transition: width 250ms, background 250ms; }
#dots button[aria-current="true"] { width: 36px; background: #F2F4F7; }
#dots button::before { content: ''; position: absolute; margin: -16px; width: 46px; height: 46px; }

/* Capas: voz, timbre, reloj nocturno */
#ov { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#ov.on { pointer-events: auto; }
.vs { position: absolute; left: 0; right: 0; bottom: 0; height: 340px; background: linear-gradient(to top, rgba(11,14,19,.98) 55%, rgba(11,14,19,0)); display: flex; flex-direction: column; justify-content: flex-end; padding: 0 64px 54px; gap: 12px; }
.vs .heard { font-size: 44px; font-weight: 500; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vs .reply { font-size: 40px; font-weight: 600; color: var(--text); }
.vs .glow { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: linear-gradient(90deg, #3E7BFF, #7FD1FF, #3E7BFF); transform-origin: 50% 50%; animation: glow 1.2s ease-in-out infinite; }
.vs.thinking .glow { animation-duration: .5s; }
.vs.done .glow { animation: none; opacity: .4; }
@keyframes glow { 0%,100% { transform: scaleX(.35); opacity: .7; } 50% { transform: scaleX(1); opacity: 1; } }
.rg { position: absolute; inset: 0; background: rgba(11,14,19,.96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.rg .t1 { font-size: 40px; color: var(--orange); font-weight: 600; }
.rg .t2 { font-family: var(--display); font-size: 120px; font-weight: 300; }
.rg .stop { margin-top: 20px; height: 110px; padding: 0 80px; border-radius: 55px; border: 0; background: var(--orange); color: #1A1208; font-size: 44px; font-weight: 700; }
.amb { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.amb .c { font-family: var(--display); font-weight: 200; font-size: 260px; line-height: 1; color: #C9D1DC; }
.amb.night .c { color: #8A5A44; }
.amb .s { font-size: 34px; color: #7D8794; }
.amb.night .s { color: #5E4436; }
#toast { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); background: #2A313C; padding: 16px 26px; border-radius: 18px; font-size: 24px; z-index: 12; opacity: 0; transition: opacity 250ms; pointer-events: none; }
#toast.on { opacity: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>

<div id="stage">
  <div id="track">
    <section class="pg" id="pg0" aria-label="Inicio">
      <div class="left">
        <div><div id="clock">--:--</div><div id="date"></div></div>

    <section class="pg" id="pg1" aria-label="Tareas y compras">

      <div class="hrow"><h2>Próximos días</h2></div>

    <section class="pg" id="pg3" aria-label="Timers y alarmas">

        <div class="hrow"><h2>Timers</h2><span class="meta" id="tm-meta"></span></div>
        <div class="presets" id="presets"></div>
        <div id="timers" style="display: flex; flex-direction: column; gap: 12px; margin-top: 14px; overflow: hidden"></div>
      </div>
      <div class="col">
        <div class="hrow"><h2>Alarmas</h2><span class="meta" id="al-meta"></span></div>
        <div class="items" id="alarms"></div>
        <div class="add"><label class="sr" for="al-time">Hora</label><input class="tin" type="time" id="al-time" value="07:00" style="flex: 1.5; min-width: 0">
          <label class="sr" for="al-days">Repetir</label><select class="tin" id="al-days"><option value="once">Una vez</option><option value="wk">Lun a vie</option><option value="all">Todos los días</option><option value="we">Sáb y dom</option></select>
          <button class="btn pri" data-act="aadd" aria-label="Agregar alarma">+</button></div>
      </div>
    </section>
  </div>

  <div id="top"><span id="status"></span><button id="mic" data-act="talk" aria-label="Hablar con Jarvis"></button></div>
  <nav id="dots" aria-label="Pantallas">
    <button data-act="go" data-arg="0" aria-label="Inicio"></button>
    <button data-act="go" data-arg="1" aria-label="Tareas y compras"></button>
    <button data-act="go" data-arg="2" aria-label="Semana"></button>
    <button data-act="go" data-arg="3" aria-label="Timers y alarmas"></button>
  </nav>
  <div id="ov"></div>
  <div id="toast" role="status"></div>
</div>

async function apiGet(action, extra) {
  const s = S.settings;
  const url = s.apiUrl + (s.apiUrl.indexOf('?') >= 0 ? '&' : '?') + 'action=' + action + '&token=' + encodeURIComponent(s.token) + (extra || '');
  const r = await fetch(url, { method: 'GET', redirect: 'follow', cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function apiPost(action, payload) {
  const s = S.settings;
  const r = await fetch(s.apiUrl, { method: 'POST', redirect: 'follow', body: JSON.stringify(Object.assign({ token: s.token, action: action }, payload || {})) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j;
}

async function sync() {
  if (isDemo()) { renderHeader(); return; }
  if (S.sync.busy || S.sync.pending > 0) { S.sync.again = true; return; }
  S.sync.busy = true; S.sync.again = false;
  const gen = S.sync.gen || 0;
  try {
    const j = await apiGet('summary', '&days=' + (S.settings.days || 7));
    if (!j.ok) throw new Error(j.error === 'unauthorized' ? 'clave incorrecta' : (j.error || 'error'));
    // Solo aplicar si no hubo cambios locales mientras se descargaba
    if (S.sync.pending === 0 && (S.sync.gen || 0) === gen) {
      S.data = j.data;
      LS.set('cache', j.data);
    } else {
      S.sync.again = true;
    }
    S.sync.ok = true; S.sync.error = ''; S.sync.last = Date.now();
  } catch (e) {
    S.sync.ok = false; S.sync.error = e.message || String(e);
  } finally {
    S.sync.busy = false;
  }
  renderAgenda(); renderLists(); renderHeader(); renderTabs();
  if (S.sync.again && S.sync.pending === 0) { S.sync.again = false; setTimeout(sync, 300); }
}

async function mutate(fn) {
  S.sync.pending++;
  S.sync.gen = (S.sync.gen || 0) + 1;
  renderLists(); renderTabs();
  try {
    if (!isDemo()) await fn();
  } catch (e) {
    toast('No se pudo guardar: ' + (e.message || e));
  } finally {
    S.sync.pending--;
    if (isDemo()) {
      S.data.tasks.forEach(x => { delete x.pending; });
      S.data.shop.forEach(x => { delete x.pending; });
      renderLists(); renderTabs();
    } else if (S.sync.pending === 0) {
      sync();
    }
  }
}

  if (kind === 'shop') {
    const ex = arr.find(x => x.title.toLowerCase() === title.toLowerCase());
    if (ex && !ex.done) return;
    if (ex && ex.done) { toggleItem(kind, ex.id); return; }
  }
  const item = { id: 'tmp' + Date.now() + Math.random(), listId: kind, title: title, done: false, due: due || null, pending: true };

/* ---------------------------- Sonido ---------------------------- */
let actx = null, beepTimer = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { /* sin audio */ }
}
function beep() {
  if (!actx) return;
  const t0 = actx.currentTime;
  [0, 0.22, 0.44].forEach((off, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = i === 2 ? 1046 : 880;
    g.gain.setValueAtTime(0.0001, t0 + off);
    g.gain.exponentialRampToValueAtTime(0.35, t0 + off + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.18);
    o.connect(g); g.connect(actx.destination);
    o.start(t0 + off); o.stop(t0 + off + 0.2);
  });
}
function ring(title, label, alarm) {
  S.ui.ring = { title: title, label: label, alarm: alarm, since: Date.now() };
  exitAmbient();
  renderOverlay();
  clearInterval(beepTimer);
  beep();
  beepTimer = setInterval(() => {
    if (!S.ui.ring || Date.now() - S.ui.ring.since > 5 * 60000) { stopRing(); return; }
    beep();
  }, 1300);
  if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
}
function stopRing() {
  clearInterval(beepTimer); beepTimer = null;
  S.ui.ring = null; renderOverlay();
}

/* ---------------------------- Voz ---------------------------- */
// FullScreendy (kiosco en la tablet) expone su propio puente de voz: la WebView de Android no trae speechSynthesis.
const FSD = window.fullscreendy && typeof window.fullscreendy.textToSpeech === 'function' ? window.fullscreendy : null;
// La WebView declara webkitSpeechRecognition pero no tiene reconocedor (sin servicios de Google): en el kiosco se escribe el comando.
const SR = (FSD || (BOOT && BOOT.kiosk)) ? null : (window.SpeechRecognition || window.webkitSpeechRecognition);
let rec = null;
// Voz de respuesta: eSpeak (meSpeak, ~5 MB, sin servicios de Google) dentro de la página.
// La WebView de Android no trae speechSynthesis y la voz de FullScreendy está fija en alemán.
const MES = { base: 'https://cdn.jsdelivr.net/npm/mespeak@2.0.2/', m: null, loading: null, src: null };
async function mesLoad() {
  if (MES.m) return MES.m;
  if (!MES.loading) MES.loading = (async () => {
    const mod = await import(MES.base + '+esm');
    const m = mod.default || mod;
    m.loadConfig(await (await fetch(MES.base + 'src/mespeak_config.json')).json());
    m.loadVoice(await (await fetch(MES.base + 'voices/es-la.json')).json());
    MES.m = m; return m;
  })();
  return MES.loading;
}
// Dice los números como palabras simples para que eSpeak no lea "09:30" raro.
function speakText(t) {
  return String(t).replace(/(\d{1,2}):(\d{2})/g, (x, h, mm) => +h + (mm === '00' ? '' : ' y ' + +mm)).replace(/°/g, ' grados').replace(/[“”"]/g, '');
}
async function speak(text) {
  if (!S.settings.speak || !text) return;
  if (window.speechSynthesis && !FSD && !(BOOT && BOOT.kiosk)) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-ES'; u.rate = 1.02;
      const v = speechSynthesis.getVoices().find(x => /^es/i.test(x.lang));
      if (v) { u.voice = v; speechSynthesis.speak(u); return; }
    } catch (e) { /* sigue con eSpeak */ }
  }
  try {
    unlockAudio(); if (!actx) return;
    let buf = null;
    if (!isDemo()) {
      try {
        const t0 = Date.now();
        const r = await Promise.race([apiPost('tts', { text: String(text).slice(0, 300) }), new Promise((_, ko) => setTimeout(() => ko(new Error('tiempo')), 12000))]);
        const bin = atob(r.audio), u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        buf = await actx.decodeAudioData(u8.buffer);
        jvLog('voz gemini', Date.now() - t0);
      } catch (e) { jvLog('voz gemini error', String(e.message || e)); }
    }
    if (!buf) {
      const m = await mesLoad();
      const raw = m.speak(speakText(text), { voice: 'es-la', rawdata: 'array', speed: 150, pitch: 45, wordgap: 1 });
      if (!raw || !raw.length) return;
      buf = await actx.decodeAudioData(new Uint8Array(raw).buffer);
    }
    try { if (MES.src) MES.src.stop(); } catch (e) { /* nada */ }
    const src = actx.createBufferSource(); const g = actx.createGain(); g.gain.value = 0.9;
    src.buffer = buf; src.connect(g); g.connect(actx.destination); src.start();
    MES.src = src;
    // Mientras habla, Jarvis no escucha la palabra de activación (evita que se oiga a sí mismo).
    JV.mute = Date.now() + buf.duration * 1000 + 400;
  } catch (e) { /* sin voz */ }
}
function openVoice() {
  S.ui.sheet = { kind: 'voice', phase: 'listen', heard: '', reply: '' };
  renderOverlay();
  startListening();
}
function startListening() {
  if (!SR) {
    S.ui.sheet.phase = 'idle';
    S.ui.sheet.note = 'Escribí el comando abajo (este dispositivo no tiene reconocimiento de voz).';
    renderOverlay();
    return;
  }
  try { if (rec) rec.abort(); } catch (e) { /* nada */ }
  rec = new SR();
  rec.lang = S.settings.lang || 'es-PY';
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  let finalText = '';
  rec.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    const sh = S.ui.sheet;
    if (sh && sh.kind === 'voice') { sh.heard = (finalText || interim).trim(); const el = $('v-heard'); if (el) el.textContent = sh.heard ? '“' + sh.heard + '”' : ''; }
  };
  rec.onerror = ev => {
    const sh = S.ui.sheet;
    if (!sh || sh.kind !== 'voice') return;
    if (ev.error === 'language-not-supported' && rec.lang !== 'es-ES') { S.settings.lang = 'es-ES'; saveSettings(); startListening(); return; }
    sh.note = ev.error === 'not-allowed' ? 'Permití el micrófono para esta página (candado de la barra de direcciones).' : ev.error === 'no-speech' ? 'No escuché nada. Tocá el micrófono para intentar de nuevo.' : 'Error de voz: ' + ev.error;
    sh.phase = 'idle'; renderOverlay();
  };
  rec.onend = () => {
    const sh = S.ui.sheet;
    if (!sh || sh.kind !== 'voice') return;
    if (finalText.trim()) runCommand(finalText.trim());
    else if (sh.phase === 'listen') { sh.phase = 'idle'; renderOverlay(); }
  };
  try { rec.start(); S.ui.sheet.phase = 'listen'; } catch (e) { S.ui.sheet.phase = 'idle'; }
}
async function runCommand(text) {
  const sh = S.ui.sheet && S.ui.sheet.kind === 'voice' ? S.ui.sheet : (S.ui.sheet = { kind: 'voice' });
  sh.phase = 'done'; sh.heard = text; sh.reply = '…'; delete sh.note;
  renderOverlay();
  let reply;
  try { reply = await handleCommand(text); } catch (e) { reply = 'Ups, algo falló: ' + (e.message || e); }
  if (S.ui.sheet && S.ui.sheet.kind === 'voice') { S.ui.sheet.reply = reply; renderOverlay(); }
  // Acciones: pitido de confirmación (rápido). Preguntas (hora, clima, agenda…): respuesta hablada.
  if (reply === 'Cancelado.' || /^No te entend/.test(reply)) { /* sin sonido: evita hablar ante activaciones accidentales */ }
  else if (/^(Agregu[eé]|Timer de|Alarma para|Anotado|Listo|Tach[eé]|Activando|Agend[eé])/.test(reply)) { if (!/apagu[eé]/.test(reply)) { unlockAudio(); beep(); } }
  else speak(reply);
  clearTimeout(runCommand._t);
  runCommand._t = setTimeout(() => { if (S.ui.sheet && S.ui.sheet.kind === 'voice' && S.ui.sheet.phase === 'done') closeSheet(); }, sh && sh.jarvis ? 3000 : 4500);
  if (sh && sh.jarvis) jvLog('respuesta', reply);
}

const NUMW = { un: 1, una: 1, uno: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, doce: 12, quince: 15, veinte: 20, treinta: 30, cuarenta: 40, cincuenta: 50 };
const WD = { domingo: 0, lunes: 1, martes: 2, 'miércoles': 3, miercoles: 3, jueves: 4, viernes: 5, 'sábado': 6, sabado: 6 };
function parseDue(str) {
  let txt = ' ' + str + ' ';
  let due = null;
  const t = new Date();
  if (/\spasado ma[nñ]ana\s/.test(txt)) { due = ymd(addDays(t, 2)); txt = txt.replace(/\spasado ma[nñ]ana\s/, ' '); }
  else if (/\sma[nñ]ana\s/.test(txt)) { due = ymd(addDays(t, 1)); txt = txt.replace(/\sma[nñ]ana\s/, ' '); }
  else if (/\shoy\s/.test(txt)) { due = ymd(t); txt = txt.replace(/\shoy\s/, ' '); }
  const wm = txt.match(/\s(?:el\s)?(domingo|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado)\s/);
  if (!due && wm) {
    const target = WD[wm[1]];
    let diff = (target - t.getDay() + 7) % 7; if (diff === 0) diff = 7;
    due = ymd(addDays(t, diff)); txt = txt.replace(wm[0], ' ');
  }
  const tm = txt.match(/\s(?:a\s+las?|a\s+la)\s+(\d{1,2})(?:[:.](\d{2}))?(?:\s*(?:hs|horas))?(?:\s+de la (?:tarde|noche|ma[nñ]ana))?/);
  if (tm) { txt = txt.replace(tm[0], ' '); if (!due) due = ymd(t); }
  return { text: txt.replace(/\s+/g, ' ').trim(), due: due };
}
const joinList = arr => arr.length > 1 ? arr.slice(0, -1).join(', ') + ' y ' + arr[arr.length - 1] : arr[0];

// El dictado por voz escribe los números con letras: "siete y media" -> "7:30", "diez minutos" -> "10 minutos".
function numWords(q) {
  const U = { dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20, veintiuno: 21, veintiun: 21, veintidos: 22, veintitres: 23, veinticuatro: 24, veinticinco: 25, veintiseis: 26, veintisiete: 27, veintiocho: 28, veintinueve: 29 };
  const T = { treinta: 30, cuarenta: 40, cincuenta: 50, sesenta: 60, setenta: 70, ochenta: 80, noventa: 90 };
  const one = Object.assign({ un: 1, uno: 1, una: 1 }, U);
  q = q.replace(/dieciséis/g, 'dieciseis').replace(/veintidós/g, 'veintidos').replace(/veintitrés/g, 'veintitres').replace(/veintiséis/g, 'veintiseis').replace(/veintiún/g, 'veintiun');
  q = q.replace(new RegExp('\\b(' + Object.keys(T).join('|') + ')(?: y (' + Object.keys(one).join('|') + '))?\\b', 'g'), (m, t, u) => String(T[t] + (u ? one[u] : 0)));
  q = q.replace(new RegExp('\\b(' + Object.keys(U).join('|') + ')\\b', 'g'), m => String(U[m]));
  if (/(alarma|despert)/.test(q)) {
    q = q.replace(/\ba la una\b/g, 'a la 1').replace(/\b(\d{1,2}) y media\b/g, '$1:30').replace(/\b(\d{1,2}) y cuarto\b/g, '$1:15')
         .replace(/\b(\d{1,2}) y (\d{1,2})\b/g, (m, a, b) => a + ':' + pad(b)).replace(/\b(\d{1,2}) en punto\b/g, '$1:00');
  }
  return q;
}
function findItem(list, what) {
  const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9ñ ]/g, ' ').replace(/\s+/g, ' ').trim();
  const w = norm(what).split(' ').filter(x => x.length > 2 && !/^(los|las|del|que|para|con|una|uno)$/.test(x));
  const open = list.filter(x => !x.done);
  return open.find(x => norm(x.title) === norm(what)) || open.find(x => w.length && w.every(k => norm(x.title).includes(k))) || open.find(x => w.length && w.some(k => k.length > 3 && norm(x.title).includes(k)));
}
async function handleCommand(raw) {
  let q = raw.toLowerCase().replace(/[¿?¡!.]/g, ' ').replace(/\s+/g, ' ').trim();
  const pm = q.match(/^(alexa|ok google|oye google|hey google|google|hey jarvis|oye jarvis|jarvis)\s*,?\s*/);
  if (pm) q = q.slice(pm[0].length);
  q = numWords(q);
  if (/^(cancel[aá]r?|cancela|cancelalo|olvid[aá]lo|olvidate|dej[aá]lo|no importa|nada|ninguna|no)$/.test(q)) return 'Cancelado.';
  const STOPV = '(?:cancel[aá]r?|cancela|par[aá]r?|deten(?:[eé]|er)?|det[eé]n|fren[aá]r?|apag[aá]r?|borr[aá]r?|sac[aá]r?|quit[aá]r?|elimin[aá]r?|termin[aá]r?|desactiv[aá]r?|cort[aá]r?)';
  const stopWords = new RegExp('^(' + STOPV + '|para ya|basta|listo|silencio|stop|ok|ya est[aá])(?=\\s|$)');
  const stopAny = new RegExp(STOPV + '.*(alarma|timer|temporizador|cron[oó]metro)');
  if (S.ui.ring && (stopWords.test(q) || stopAny.test(q))) { stopRing(); return 'Listo, lo apagué.'; }
  if (stopWords.test(q) && q.split(' ').length <= 3 && !/(timer|temporizador|cron[oó]metro|alarma|despertador)/.test(q)) return 'Listo.';
  const numRe = '\\b(\\d+|' + Object.keys(NUMW).join('|') + ')';
  let m;

  // Temas
  if ((m = q.match(/(?:tema|modo|estilo)\s+(navide[nñ]o|navidad|verano|cl[aá]sico|noche|oscuro|claro|smart display|asistente|material|cristal|autom[aá]tico)/))) {
    const map = { 'navideño': 'navidad', navideno: 'navidad', navidad: 'navidad', verano: 'verano', 'clásico': 'clasico', clasico: 'clasico', claro: 'clasico', noche: 'noche', oscuro: 'noche', 'smart display': 'asistente', asistente: 'asistente', material: 'material', cristal: 'cristal', 'automático': 'auto', automatico: 'auto' };
    S.settings.theme = map[m[1]] || 'auto'; saveSettings(); applyTheme();
    return 'Listo, tema ' + (S.settings.theme === 'auto' ? 'automático' : THEMES[S.settings.theme].name) + '.';
  }
  // Modo ambiente
  if (/(modo ambiente|protector|pantalla de descanso)/.test(q)) { setTimeout(enterAmbient, 1500); return 'Activando modo ambiente.'; }
  // Timer
  // Detener / cancelar timers (antes de la regla que crea timers)
  if (new RegExp(STOPV + '.*(timer|temporizador|cron[oó]metro)').test(q)) {
    if (!S.timers.length) return 'No hay timers en marcha.';
    if (/\btodos\b|\blos (timers|temporizadores)\b/.test(q)) { const n = S.timers.length; S.timers = []; saveTimers(); renderTimersCard(); return n === 1 ? 'Listo, quité el timer.' : 'Listo, quité los ' + n + ' timers.'; }
    let t = null;
    const dm = q.match(new RegExp(numRe + '\\s*(segundos?|seg|minutos?|min|horas?|hs?)\\b'));
    if (dm) {
      const n = /\d/.test(dm[1]) ? parseInt(dm[1], 10) : NUMW[dm[1]];
      const c0 = dm[2].charAt(0), secs = n * (c0 === 's' ? 1 : c0 === 'h' ? 3600 : 60);
      t = S.timers.find(x => x.total === secs) || null;
    }
    if (!t) {
      const lm = q.match(/(?:timer|temporizador|cron[oó]metro)\s+(?:de\s+|del\s+|para\s+)?(?:los\s+|las\s+|el\s+|la\s+)?(.+)$/);
      if (lm) { const f = findItem(S.timers.map(x => ({ id: x.id, title: x.label })), lm[1]); if (f) t = S.timers.find(x => x.id === f.id); }
    }
    if (!t && S.timers.length === 1) t = S.timers[0];
    if (!t) { const n = S.timers.length; S.timers = []; saveTimers(); renderTimersCard(); return n === 1 ? 'Listo, quité el timer.' : 'Listo, quité los ' + n + ' timers.'; }
    S.timers = S.timers.filter(x => x.id !== t.id); saveTimers(); renderTimersCard();
    return 'Listo, quité el timer ' + t.label + '.';
  }
  // Detener / cancelar alarmas (antes de la regla que crea alarmas)
  if (new RegExp(STOPV + '.*(alarma|despertador)').test(q)) {
    const tm = q.match(/\b(\d{1,2})(?::(\d{2}))?\b/);
    const before = S.alarms.length;
    if (tm) { const t = pad(+tm[1]) + ':' + (tm[2] || '00'); S.alarms = S.alarms.filter(a => a.time !== t && a.time !== pad((+tm[1] + 12) % 24) + ':' + (tm[2] || '00')); }
    else if (/todas/.test(q)) S.alarms = [];
    else { const nx = nextAlarm(); if (nx) S.alarms = S.alarms.filter(a => a !== nx); }
    saveAlarms(); renderTimersCard(); renderHeader();
    return before > S.alarms.length ? 'Listo, quité ' + (before - S.alarms.length === 1 ? 'la alarma.' : 'las alarmas.') : 'No encontré esa alarma.';
  }
  if (/(timer|temporizador|cron[oó]metro)/.test(q) && (m = q.match(new RegExp(numRe + '\\s*(segundos?|seg|minutos?|min|horas?|hs?)\\b')))) {
    const n = /\d/.test(m[1]) ? parseInt(m[1], 10) : NUMW[m[1]];
    const c0 = m[2].charAt(0);
    const u = c0 === 's' ? 1 : c0 === 'h' ? 3600 : 60;
    const unit = u === 1 ? 'seg' : u === 60 ? 'min' : (n === 1 ? 'hora' : 'horas');
    const lm = q.match(/para (?:el |la |los |las )?(.+)$/);
    addTimer(n * u, lm ? cap(lm[1]) : n + ' ' + unit);
    return 'Timer de ' + n + ' ' + unit + (lm ? ' para ' + lm[1] : '') + ' en marcha.';
  }
  // Alarma
  if (/(alarma|despert)/.test(q) && (m = q.match(/\b(\d{1,2})(?:[:.h ](\d{2}))?\b/))) {
    let h = parseInt(m[1], 10);
    if (/(tarde|noche)/.test(q) && h < 12) h += 12;
    const time = pad(h % 24) + ':' + (m[2] || '00');
    const days = /(todos los d[ií]as)/.test(q) ? [0, 1, 2, 3, 4, 5, 6] : /(lunes a viernes|d[ií]as de semana|semana)/.test(q) ? [1, 2, 3, 4, 5] : [];
    S.alarms.push({ id: 'a' + Date.now(), time: time, label: 'Alarma', days: days, on: true }); saveAlarms();
    S.ui.ta = 'alarms'; renderTimersCard(); renderHeader();
    return 'Alarma para las ' + time + (days.length ? ' (' + daysText({ days: days }) + ')' : '') + '.';
  }
  // Compras: agregar
  if ((m = q.match(/(?:agreg[aá]r?|a[nñ]ad[ií]r?|sum[aá]r?|pon[eé]r?|anot[aá]r?)\s+(.+?)\s+(?:a|en)\s+(?:la\s+|mi\s+)?(?:lista|compras|s[uú]per)/)) || (m = q.match(/^(?:hay que |tenemos que |falta )?compr(?:ar|á)\s+(.+)$/))) {
    const items = m[1].split(/\s*,\s*|\s+y\s+/).map(x => x.trim()).filter(Boolean);
    items.forEach(x => addItem('shop', x));
    S.ui.tab = 'compras'; renderTabs(); renderLists();
    return 'Agregué ' + joinList(items) + ' a Compras.';
  }
  // Compras: quitar
  if ((m = q.match(/(?:sac[aá]|quit[aá]|borr[aá]|elimin[aá]|tach[aá])\s+(?:el |la |los |las )?(.+?)\s+de\s+(?:la\s+)?(?:lista|compras)/))) {
    const it = findItem(S.data.shop, m[1]);
    if (!it) return 'No encontré ' + m[1] + ' en Compras.';
    toggleItem('shop', it.id); renderLists();
    return 'Listo, taché ' + it.title + '.';
  }
  if (/(qu[eé] (hay que|tengo que|falta) comprar|lista de compras)/.test(q)) {
    const p = S.data.shop.filter(x => !x.done).map(x => x.title);
    S.ui.tab = 'compras'; renderTabs();
    return p.length ? 'En Compras hay: ' + joinList(p) + '.' : 'La lista de compras está vacía.';
  }
  // Tareas: marcar como hecha
  if ((m = q.match(/^(?:ya\s+)?(?:hice|termin[eé]|complet[eé])\s+(?:la tarea\s+|de\s+)?(.+)$/)) || (m = q.match(/(?:tach[aá]|complet[aá]|marc[aá]|termin[aá]|sac[aá]|quit[aá]|borr[aá]|elimin[aá])\s+(?:la tarea\s+)?(?:el |la |los |las )?(.+?)(?:\s+(?:de|en)\s+(?:las\s+|mis\s+)?tareas|\s+como hecha)?$/))) {
    const it = findItem(S.data.tasks, m[1]);
    if (it) { toggleItem('tasks', it.id); renderLists(); return 'Listo, taché la tarea ' + it.title + '.'; }
    const sh = findItem(S.data.shop, m[1]);
    if (sh) { toggleItem('shop', sh.id); renderLists(); return 'Listo, taché ' + sh.title + ' de Compras.'; }
    return 'No encontré ' + m[1] + ' en tus tareas.';
  }
  // Agenda: crear evento (Gemini interpreta fecha y hora en el script)
  if (/^(agend[aá]|cre[aá] (?:un )?evento|agreg[aá] (?:un )?evento|pon[eé] (?:un )?evento|anot[aá] en (?:el |mi )?calendario|program[aá] (?:un )?evento)/.test(q) || /(evento|cita|turno|reuni[oó]n|cumplea[nñ]os).*(calendario|agenda)/.test(q)) {
    if (isDemo()) return 'En modo demo no puedo agendar eventos.';
    const r = await apiPost('addEvent', { text: raw });
    setTimeout(() => sync(), 1500);
    return 'Agendé ' + r.title + ' ' + r.when + '.';
  }
  // Tareas / recordatorios
  if ((m = q.match(/tarea\s*:?\s+(.+)$/)) || (m = q.match(/(?:record[aá]r?me|recu[eé]rdame|acordame|hac[eé]me acordar)\s+(?:de\s+)?(?:que\s+)?(?:hay que\s+)?(.+)$/))) {
    const pd = parseDue(m[1]);
    addItem('tasks', pd.text, pd.due);
    S.ui.tab = 'tareas'; renderTabs(); renderLists();
    const dl = dueLabel(pd.due);
    return 'Anotado' + (dl ? ' para ' + dl.t.toLowerCase() : '') + ': ' + cap(pd.text) + '.';
  }
  if (/(qu[eé] tareas|tareas pendientes|qu[eé] tengo pendiente)/.test(q)) {
    const p = S.data.tasks.filter(x => !x.done).map(x => x.title);
    S.ui.tab = 'tareas'; renderTabs();
    return p.length ? 'Tenés ' + p.length + ' pendientes: ' + joinList(p.slice(0, 5)) + '.' : 'No tenés tareas pendientes.';
  }
  // Agenda
  if (/(qu[eé] tengo|qu[eé] hay|agenda|eventos|calendario)/.test(q)) {
    const tomorrow = /ma[nñ]ana/.test(q);
    const d = addDays(new Date(), tomorrow ? 1 : 0);
    const list = eventsOn(ymd(d)).filter(e => tomorrow || e.allDay || new Date(e.end).getTime() > Date.now());
    S.ui.day = tomorrow ? 1 : 0; S.ui.tab = 'agenda'; renderAgenda(); renderTabs();
    if (!list.length) return tomorrow ? 'Mañana no tenés eventos.' : 'No te quedan eventos por hoy.';
    const first = list[0];
    return (tomorrow ? 'Mañana tenés ' : 'Hoy te quedan ') + list.length + (list.length === 1 ? ' evento' : ' eventos') + '. ' + (tomorrow ? 'El primero es ' : 'El próximo es ') + first.title + (first.allDay ? '' : ' a las ' + hm(new Date(first.start))) + '.';
  }
  // Clima
  if (/(clima|tiempo|temperatura|llover|lluvia|calor|fr[ií]o)/.test(q)) {
    const w = S.weather;
    if (!w) return 'Todavía no configuraste tu ciudad para el clima.';
    let r = 'Ahora hace ' + w.temp + '° y está ' + WMO(w.code)[0].toLowerCase() + '. Máxima de ' + w.max + '°.';
    if (w.daily && w.daily[0]) r += ' Mañana: ' + WMO(w.daily[0].c)[0].toLowerCase() + ', ' + w.daily[0].hi + '°.';
    return r;
  }
  if (/navidad/.test(q)) {
    const x = xmasInfo(new Date());
    return x.days > 0 ? 'Faltan ' + x.days + ' días para Navidad.' : x.label;
  }
  if (/(qu[eé] hora)/.test(q)) return 'Son las ' + hm(new Date()) + '.';
  return 'No te entendí. Probá con alguno de los ejemplos.';
}

  const days = [{ c: w.code, hi: w.max, lo: w.min, p: w.rain ? w.rain[0] : null, lbl: 'Hoy' }].concat((w.daily || []).slice(0, 4).map((x, i) => ({ c: x.c, hi: x.hi, lo: x.lo, p: x.p, lbl: i === 0 ? 'Mañana' : DS[addDays(t, i + 1).getDay()] })));
  $('fc').innerHTML = days.map(x => {
    const k = WMO(x.c)[1], col = k === 'sun' ? 'var(--orange)' : (k === 'rain' || k === 'storm') ? 'var(--blue)' : 'var(--soft)';
    return '<div class="fd"><span class="d">' + x.lbl + '</span><span style="color:' + col + '">' + ic(k, 52, 1.6) + '</span><span class="h">' + x.hi + '°</span><span class="l">' + x.lo + '°</span>' + (x.p != null ? '<span class="p">' + x.p + '% lluvia</span>' : '') + '</div>';
  }).join('');
  $('fc-meta').textContent = S.settings.place || '';
}
function evRow(e, next) {
  const time = e.allDay ? '<div class="t ad">Todo el día</div>' : '<div class="t">' + hm(new Date(e.start)) + '</div>';
  const sub = next && !e.allDay ? '<div class="s">' + relIn(new Date(e.start) - Date.now()) + '</div>' : '';
  return '<div class="ev' + (next ? ' next' : '') + '"><div class="dot" style="background:' + esc(e.color || calColor(e.calendar)) + '"></div>' + time + '<div style="min-width:0"><div class="n">' + esc(e.title) + '</div>' + sub + '</div></div>';
}
function renderAgenda() {
  const now = new Date(), today = ymd(now), tom = ymd(addDays(now, 1));
  const ev = eventsOn(today).filter(e => e.allDay || new Date(e.end || e.start) > now);
  const nextIdx = ev.findIndex(e => !e.allDay);
  $('today').innerHTML = ev.slice(0, 4).map((e, i) => evRow(e, i === nextIdx)).join('') || '<div class="empty">No te quedan eventos hoy.</div>';
  $('today-meta').textContent = ev.length ? ev.length + (ev.length === 1 ? ' evento' : ' eventos') : '';
  const et = eventsOn(tom);
  $('tom').innerHTML = et.slice(0, 2).map(e => evRow(e, false)).join('') || '<div class="empty">Nada agendado.</div>';
  // Semana: los 6 días siguientes a mañana
  let html = '';
  for (let i = 1; i <= 6; i++) {
    const d = addDays(now, i), key = ymd(d), list = eventsOn(key);
    html += '<div class="wd"><div class="dh">' + (i === 1 ? 'Mañana' : DL[d.getDay()] + ' ' + d.getDate()) + '</div>' +
      (list.slice(0, 2).map(e => '<div class="we"><b>' + (e.allDay ? '•' : hm(new Date(e.start))) + '</b>' + esc(e.title) + '</div>').join('') || '<div class="none">Libre</div>') +
      (list.length > 2 ? '<div class="none">+' + (list.length - 2) + ' más</div>' : '') + '</div>';
  }
  $('week').innerHTML = html;
}

/* ---- Listas ---- */
function listHtml(kind, arr) {
  return sortItems(arr).slice(0, 7).map(x => {
    const dl = kind === 'tasks' && !x.done ? dueLabel(x.due) : null;
    return '<button class="it' + (x.done ? ' done' : '') + '" data-act="tog" data-kind="' + kind + '" data-arg="' + esc(x.id) + '" aria-pressed="' + !!x.done + '">' +
      '<span class="box">' + (x.done ? ic('check', 28, 3) : '') + '</span><span class="tx">' + esc(x.title) + '</span>' +
      (dl ? '<span class="due' + (dl.late ? ' late' : '') + '">' + esc(dl.t) + '</span>' : '') + '</button>';
  }).join('') || '<div class="empty">' + (kind === 'shop' ? 'Nada para comprar.' : 'Sin tareas pendientes.') + '</div>';
}
function renderLists() {
  const t = S.data.tasks || [], s = S.data.shop || [];
  const kt = JSON.stringify(t.map(x => [x.id, x.title, x.done, x.due])), ks = JSON.stringify(s.map(x => [x.id, x.title, x.done]));
  if (kt !== UI.kt) { UI.kt = kt; $('tasks').innerHTML = listHtml('tasks', t); }
  if (ks !== UI.ks) { UI.ks = ks; $('shop').innerHTML = listHtml('shop', s); }
  const tl = t.filter(x => !x.done).length, sl = s.filter(x => !x.done).length;
  $('t-meta').textContent = tl + (tl === 1 ? ' pendiente' : ' pendientes');
  $('s-meta').textContent = sl + ' por comprar';
}
// Los comandos de voz cambian S.ui.tab: se muestra la pantalla que corresponde.
function renderTabs() {
  if (S.ui.tab === UI.lastTab) return;
  UI.lastTab = S.ui.tab;
  const p = { agenda: 0, tareas: 1, compras: 1 }[S.ui.tab];
  if (p != null && UI.started) goPage(p, true);
}

/* ---- Timers y alarmas ---- */
function timerHtml(t, cls) {
  const r = remaining(t), st = t.st === 'done' ? '¡Listo!' : t.st === 'run' ? 'En curso' : 'En pausa';
  const pct = t.total ? Math.min(100, (t.total - r) / t.total * 100) : 0;
  return '<div class="' + cls + (t.st === 'done' ? ' done' : '') + '" data-tid="' + t.id + '"><div class="info"><span class="lbl">' + esc(t.label) + ' · ' + st + '</span>' +
    '<span class="big" data-disp>' + fmtSecs(r) + '</span><div class="bar"><div data-bar style="width:' + pct + '%"></div></div></div>' +
    (cls === 'tm' ? '<button class="rb" data-act="ttoggle" data-arg="' + t.id + '" aria-label="Pausar o seguir">' + ic(t.st === 'run' ? 'pause' : t.st === 'done' ? 'reset' : 'play', 28, 2.4) + '</button>' +
      '<button class="rb" data-act="tremove" data-arg="' + t.id + '" aria-label="Quitar timer">' + ic('x', 28, 2.4) + '</button>' : '') + '</div>';
}
function renderHomeCards() {
  const t = S.timers.find(x => x.st === 'run') || S.timers.find(x => x.st === 'done') || S.timers[0];
  const na = nextAlarm();
  let h = '';
  if (t) h += '<button class="card" style="flex:1" data-act="go" data-arg="3">' + timerHtml(t, 'tmh').replace('class="tmh', 'style="display:flex;flex-direction:column;gap:8px" class="tmh') + '</button>';
  else h += '<button class="card" style="flex:1" data-act="go" data-arg="3"><span class="lbl">' + ic('timer', 26) + 'Timers</span><span class="big" style="font-size:40px;color:var(--muted)">Ninguno</span><span class="lbl">Tocá para agregar uno</span></button>';
  h += '<button class="card" style="width:210px" data-act="go" data-arg="3"><span class="lbl">' + ic('alarm', 26) + 'Alarma</span><span class="big">' + (na ? na.time : '--:--') + '</span><span class="lbl">' + (na ? daysText(na) : 'Sin alarmas') + '</span></button>';
  $('home-cards').innerHTML = h;
}
function renderTimersCard() {
  S.ui.ta = 'timers';
  $('timers').innerHTML = S.timers.slice(0, 4).map(t => timerHtml(t, 'tm')).join('') || '<div class="empty">Sin timers. Tocá un tiempo o pedíselo a Jarvis.</div>';
  const run = S.timers.filter(t => t.st === 'run').length;
  $('tm-meta').textContent = run ? run + ' en curso' : '';
  $('alarms').innerHTML = S.alarms.slice().sort((a, b) => a.time < b.time ? -1 : 1).slice(0, 5).map(a =>
    '<div class="al' + (a.on ? '' : ' off') + '"><div style="flex:1;min-width:0"><div class="big">' + a.time + '</div><div class="meta">' + esc(daysText(a)) + '</div></div>' +
    '<button class="sw" role="switch" aria-checked="' + a.on + '" aria-label="Alarma ' + a.time + '" data-act="atoggle" data-arg="' + a.id + '"></button>' +
    '<button class="rb" data-act="aremove" data-arg="' + a.id + '" aria-label="Borrar alarma ' + a.time + '">' + ic('x', 26, 2.4) + '</button></div>').join('') || '<div class="empty">Sin alarmas.</div>';
  const on = S.alarms.filter(a => a.on).length;
  $('al-meta').textContent = on + (on === 1 ? ' activa' : ' activas');
  renderHomeCards();
}

/* ---- Capas ---- */
function renderOverlay() {
  const ov = $('ov'), r = S.ui.ring, sh = S.ui.sheet;
  if (r) {
    ov.className = 'on';
    ov.innerHTML = '<div class="rg"><div class="t1">' + esc(r.title) + '</div><div class="t2">' + esc(r.label || '') + '</div><button class="stop" data-act="stopring">Detener</button></div>';
  } else if (sh && sh.kind === 'voice') {
    ov.className = 'on';
    const cls = sh.phase === 'done' ? 'done' : JV.state === 'flush' ? 'thinking' : '';
    const heard = sh.heard ? '“' + esc(sh.heard) + '”' : (sh.phase === 'listen' ? 'Te escucho…' : '');
    ov.innerHTML = '<div class="vs ' + cls + '" data-act="closesheet"><div class="heard" id="v-heard">' + heard + '</div>' +
      (sh.reply ? '<div class="reply">' + esc(sh.reply) + '</div>' : '') + '<div class="glow"></div></div>';
  } else if (S.ui.ambient) {
    ov.className = 'on';
    const d = new Date(), night = d.getHours() >= 22 || d.getHours() < 6, w = S.weather;
    const nx = eventsOn(ymd(d)).find(e => !e.allDay && new Date(e.start) > d);
    ov.innerHTML = '<div class="amb' + (night ? ' night' : '') + '" data-act="unambient"><div class="c" id="amb-c">' + hm(d) + '</div>' +
      '<div class="s">' + (w ? w.temp + '° · ' : '') + (nx ? hm(new Date(nx.start)) + ' ' + esc(nx.title) : DL[d.getDay()] + ' ' + d.getDate()) + '</div></div>';
  } else { ov.className = ''; ov.innerHTML = ''; }
}
function closeSheet() { S.ui.sheet = null; renderOverlay(); }
function toast(text) { const t = $('toast'); t.textContent = text; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 3200); }
function enterAmbient() { if (S.ui.ring || S.ui.sheet) return; S.ui.ambient = true; renderOverlay(); }
function exitAmbient() { if (!S.ui.ambient) return; S.ui.ambient = false; S.lastInput = Date.now(); renderOverlay(); }
function applyTheme() { /* tema oscuro fijo */ }
// Sin uso: vuelve a Inicio a los 45 s; de noche (22–6 h) pasa al reloj nocturno a los 2 min.
function checkIdle() {
  const idle = Date.now() - S.lastInput;
  if (UI.page !== 0 && idle > 45000 && !S.ui.sheet && !S.ui.ring) goPage(0, true);
  const h = new Date().getHours();
  if (!S.ui.ambient && (h >= 22 || h < 6) && idle > 120000) enterAmbient();
}

/* ---- Toques, formularios y deslizamiento ---- */
const ACTIONS = {
  go: a => goPage(+a),
  tog: (a, el) => toggleItem(el.dataset.kind === 'shop' ? 'shop' : 'tasks', a),
  clear: a => clearDone(a === 'shop' ? 'shop' : 'tasks'),
  preset: a => { unlockAudio(); addTimer(+a * 60, a + ' min'); },
  ttoggle: a => timerToggle(a),
  tremove: a => { S.timers = S.timers.filter(t => t.id !== a); saveTimers(); renderTimersCard(); },
  atoggle: a => { const x = S.alarms.find(z => z.id === a); if (x) { x.on = !x.on; saveAlarms(); renderTimersCard(); } },
  aremove: a => { S.alarms = S.alarms.filter(z => z.id !== a); saveAlarms(); renderTimersCard(); },
  aadd: () => {
    const t = $('al-time').value || '07:00', v = $('al-days').value;
    const days = v === 'wk' ? [1, 2, 3, 4, 5] : v === 'all' ? [0, 1, 2, 3, 4, 5, 6] : v === 'we' ? [0, 6] : [];
    S.alarms.push({ id: 'a' + Date.now(), time: t, label: 'Alarma', days: days, on: true }); saveAlarms(); renderTimersCard(); toast('Alarma para las ' + t);
  },
  stopring: () => stopRing(),
  closesheet: () => closeSheet(),
  unambient: () => exitAmbient(),
  talk: () => { unlockAudio(); if (JV.state === 'wake') jvHeard(); else toast('Jarvis todavía está cargando…'); }
};
function bindInput() {
  const tr = $('track'), st = $('stage');
  let x0 = null, y0 = 0, dx = 0, moved = false, t0 = 0;
  st.addEventListener('pointerdown', e => {
    S.lastInput = Date.now(); unlockAudio(); exitAmbient();
    if (e.target.closest('input,select,#ov.on,#dots,#top')) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; moved = false; t0 = performance.now();
  }, { passive: true });
  st.addEventListener('pointermove', e => {
    if (x0 === null) return;
    dx = (e.clientX - x0) / UI.scale;
    if (!moved && Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(e.clientY - y0)) moved = true;
    if (!moved) return;
    let d = dx;
    if ((UI.page === 0 && d > 0) || (UI.page === PAGES - 1 && d < 0)) d = d / 4;
    setX(-UI.page * 1280 + d, false);
  }, { passive: true });
  const end = () => {
    if (x0 === null) return;
    x0 = null;
    if (!moved) return;
    const v = Math.abs(dx) / Math.max(1, performance.now() - t0);
    if (dx < -110 || (dx < -40 && v > 0.5)) goPage(UI.page + 1); else if (dx > 110 || (dx > 40 && v > 0.5)) goPage(UI.page - 1); else goPage(UI.page);
    UI.swallow = Date.now();
  };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end); st.addEventListener('pointerleave', end);
  st.addEventListener('click', e => {
    if (UI.swallow && Date.now() - UI.swallow < 350) { e.preventDefault(); return; }
    const el = e.target.closest('[data-act]'); if (!el) return;
    const fn = ACTIONS[el.dataset.act]; if (fn) fn(el.dataset.arg, el);
  });
  document.querySelectorAll('form[data-form]').forEach(f => f.addEventListener('submit', e => {
    e.preventDefault();
    const inp = f.querySelector('input'), v = inp.value.trim(); if (!v) return;
    addItem(f.dataset.form === 'shop' ? 'shop' : 'tasks', v); inp.value = ''; inp.blur(); renderLists();
  }));
}

let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* no soportado */ } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); sync(); renderAll(); } });
function renderAll() { renderClock(); renderWeather(); renderTimersCard(); renderAgenda(); renderLists(); renderHeader(); }
function init() {
  fit(); addEventListener('resize', fit);
  $('mic').innerHTML = ic('mic', 30, 2);
  $('presets').innerHTML = [1, 3, 5, 10, 15, 30].map(n => '<button class="pre" data-act="preset" data-arg="' + n + '">' + n + ' min</button>').join('');
  S.data = isDemo() ? demoData() : LS.get('cache', { events: [], tasks: [], shop: [], calendars: [] });
  S.weather = LS.get('weather', null);
  bindInput(); goPage(0, true); renderAll();
  loadWeather(); sync(); keepAwake();
  UI.lastTab = S.ui.tab; UI.started = true;
  let lastMinute = -1;
  setInterval(() => {
    const d = new Date();
    tickTimers();
    if (d.getMinutes() !== lastMinute) { lastMinute = d.getMinutes(); renderClock(); checkAlarms(); renderAgenda(); renderHeader(); if (S.ui.ambient) renderOverlay(); }
    checkIdle();
  }, 1000);
  setInterval(sync, 60 * 1000);
  setInterval(loadWeather, 20 * 60 * 1000);
  addEventListener('online', () => { sync(); loadWeather(); });
}
init();
{ const jt = location.search.match(/[?&]jvtest=([^&]+)/); if (jt) jvTest(decodeURIComponent(jt[1]).split(',')); else setTimeout(jvStart, 2500); }
